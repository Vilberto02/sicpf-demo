# =============================================================================
# Render Blueprint (Infrastructure as Code) - SICPF Platform
# =============================================================================
# Puedes usar este archivo desde el Dashboard de Render en "Blueprints" -> "New Blueprint Instance"
# o configurar los servicios manualmente siguiendo la guía en deployment_plan_render_neon.md

services:
  # ---------------------------------------------------------------------------
  # 1. Backend Web Service (Django REST Framework + Gunicorn + WhiteNoise)
  # ---------------------------------------------------------------------------
  - type: web
    name: sicpf-backend
    runtime: python
    region: ohio
    plan: free
    rootDir: source/backend
    buildCommand: ./build.sh
    startCommand: gunicorn sicpf_core.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # Pega aquí tu cadena de conexión copiada de Neon con ?sslmode=require
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: https://sicpf-demo.onrender.com,http://localhost:5173
      - key: CSRF_TRUSTED_ORIGINS
        value: https://sicpf-backend.onrender.com,https://sicpf-demo.onrender.com

  # ---------------------------------------------------------------------------
  # 2. Frontend Static Site (React + Vite + Tailwind SPA)
  # ---------------------------------------------------------------------------
  - type: web
    name: sicpf-demo
    runtime: static
    plan: free
    rootDir: source/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Regla de reescritura indispensable para React Router (evita 404 al recargar)
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://sicpf-backend.onrender.com/api
